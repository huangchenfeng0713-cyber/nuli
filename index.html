<style>
/* Layout: one phone-width column, white canvas, floating round controls on top, composer docked at the bottom.
   Light-only on purpose: it mirrors the reference app's light skin. */
:root{
  --bg:#ffffff;
  --bg2:#f5f5f7;
  --outer:#e7e8ec;
  --fg:#111114;
  --fg2:#8e8e93;
  --fg3:#b4b4b9;
  --line:#ececee;
  --chip:#e4e4e7;
  --seg:#f1f1f3;
  --blue:#2f6fe8;
  --blue2:#3d82f6;
  --blue-soft:#eaf1fe;
  --green:#34c759;
  --red:#ef3b2d;
  --shadow:0 2px 14px rgba(20,20,30,.08);
  --pop-shadow:0 10px 40px rgba(20,20,30,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --fs:16px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--outer);color:var(--fg);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
svg{display:block}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;font-size:var(--fs)}
@media (min-width:520px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.04),0 20px 60px rgba(0,0,0,.12)}}

/* top bar */
#topbar{position:absolute;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#topbar>*{pointer-events:auto}
#app.chatting #topbar{background:linear-gradient(#fff 64%,rgba(255,255,255,0));padding-bottom:16px}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.86);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rbtn svg{width:24px;height:24px}
#topTitle{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(255,255,255,.86);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:58%}
#topTitle img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eef1f6}
#topTitle b{display:block;font-size:15px;line-height:1.1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topTitle small{display:block;font-size:11.5px;color:var(--fg2);white-space:nowrap}

/* home */
main{flex:1;min-height:0;position:relative}
#home{display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.home-top{flex:1.25;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:22px;padding-bottom:4px;min-height:200px}
#greet{font-size:23px;font-weight:600;margin:0;letter-spacing:.5px;text-align:center}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;width:248px;height:50px;padding:4px;border-radius:999px;background:var(--seg)}
.seg-thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:42px;border-radius:999px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.seg.work .seg-thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;font-size:17px;color:#7c7c82;transition:color .2s}
.seg button.on{color:var(--fg);font-weight:500}
.home-mid{flex:1}
.home-rec{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:12px}
.rec-title{font-size:14px;color:var(--fg2);margin:0 0 2px 6px}
.rec{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:38px;padding:7px 12px;border:1px solid var(--chip);border-radius:11px;font-size:15.5px;text-align:left;background:#fff;line-height:1.35}
.rec:active{background:#f6f6f7}
.rec svg{width:16px;height:16px;flex:none}
.rec .skill{display:inline-flex;align-items:center;gap:3px;color:var(--blue2);flex:none}
.rec .txt{min-width:0}

/* chat */
#chat{overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#msgs{display:flex;flex-direction:column;gap:18px;padding:78px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.m-user{align-self:flex-end;max-width:82%;background:#f2f3f5;border-radius:18px 18px 4px 18px;padding:10px 14px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.m-bot{display:flex;flex-direction:column;gap:8px;min-width:0}
.think{border-radius:14px}
.think-h{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#5f6168;padding:2px 0}
.think-h .av{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;background:#eef1f6;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.think-h .av canvas,.think-h .av img{width:100%;height:100%;display:block;object-fit:cover}
.think-h .lvtag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:#f1f2f5;color:#55575e}
.think-h .tm{font-variant-numeric:tabular-nums;color:var(--fg2)}
.think-h .chev{margin-left:auto;color:var(--fg3);transition:transform .2s}
.think.closed .chev{transform:rotate(-90deg)}
.think-b{margin:6px 0 0 14px;padding:2px 0 2px 12px;border-left:2px solid #e6e7ea;color:#7d7f86;font-size:14px;line-height:1.75}
.think.closed .think-b{display:none}
.think-b p{margin:0}
.think-b p.new{animation:fadeIn .35s ease}
.ans{font-size:16.5px;line-height:1.75;word-break:break-word}
.ans p{margin:0 0 .5em}
.ans p:last-child{margin-bottom:0}
.ans b{font-weight:600}
.caret{display:inline-block;width:8px;height:1.05em;vertical-align:-2px;background:#222;border-radius:2px;margin-left:2px;animation:blink 1s steps(1) infinite}
.acts{display:flex;gap:4px;color:#8a8c93;margin-left:-6px}
.acts button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.acts button:active{background:#f2f2f4}
.acts svg{width:19px;height:19px}
.acts .on{color:var(--blue2)}
.followups{display:flex;flex-wrap:wrap;gap:8px}
.followups button{font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--chip);background:#fff;display:inline-flex;gap:5px;align-items:center}
.followups svg{width:14px;height:14px}
.sysnote{align-self:center;font-size:12.5px;color:var(--fg2);background:#f5f5f7;border-radius:999px;padding:5px 12px;text-align:center}

/* composer */
#composer{position:relative;z-index:15;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 14px)}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--chip);background:#fff;font-size:15.5px;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip .more{color:var(--fg3);font-size:13px;margin-left:-2px}
.chip.blue{border-color:#a9c4f5;color:var(--blue2)}
.chip.effort{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,var(--effort-grad,linear-gradient(90deg,#d9d9de,#d9d9de)) border-box;border:1.5px solid transparent}
.chip.effort .dot{width:22px;height:22px;border-radius:50%;overflow:hidden;background:#eef1f6;margin-left:-6px}
.chip.effort .dot img{width:100%;height:100%;object-fit:cover;display:block}
.chip.apps{gap:0;padding:0 12px}
.chip.apps i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px;display:block}
.chip.apps i:first-child{margin-left:0}
.inputbar{display:flex;align-items:flex-end;gap:6px;min-height:56px;padding:8px 10px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.07)}
.ibtn{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:50%}
.ibtn svg{width:27px;height:27px}
#inp{flex:1;min-width:0;border:0;outline:0;resize:none;font:inherit;font-size:16.5px;line-height:24px;padding:8px 2px;max-height:120px;background:transparent;color:var(--fg)}
#inp::placeholder{color:#a3a3a8}
.sendbtn{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.sendbtn svg{width:22px;height:22px}
.sendbtn.stop{background:#111}

/* popover */
#popover{position:absolute;z-index:32;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--compH,120px) - 46px);width:min(258px,74%);border-radius:24px;background:rgba(255,255,255,.9);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 0 0 1px rgba(0,0,0,.06),var(--pop-shadow);padding:6px 0;transform-origin:20% 100%;animation:popIn .22s cubic-bezier(.2,1.2,.4,1)}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;font-size:16px;text-align:left}
.pi svg{width:21px;height:21px;flex:none}
.pi .r{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--fg2);font-size:15.5px}
.pi .r svg{width:16px;height:16px}
.pi .gd{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin:0 2px}
.pi .gd.off{background:#b9b9be}
.pdiv{height:1px;background:var(--line);margin:4px 0}
.ring{width:21px;height:21px;flex:none}
#popScrim,.scrimx{position:absolute;inset:0;z-index:31}

/* drawer */
#scrim{position:absolute;inset:0;z-index:40;background:rgba(40,40,46,.2);opacity:0;transition:opacity .28s}
#scrim.show{opacity:1}
#drawer{position:absolute;z-index:41;top:0;bottom:0;left:0;width:81%;max-width:372px;background:#fff;transform:translateX(-102%);transition:transform .32s cubic-bezier(.25,.9,.3,1);display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.06)}
#drawer.open{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px max(20px,env(safe-area-inset-left,0px))}
.dr-head h2{font-size:21px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.dr-head h2 small{font-size:11px;font-weight:500;color:#fff;background:#111;border-radius:6px;padding:2px 6px;letter-spacing:.5px}
.dr-scroll{flex:1;overflow-y:auto;padding:4px 0 90px}
.dr-item{display:flex;align-items:center;gap:14px;width:100%;padding:12px max(20px,env(safe-area-inset-left,0px));font-size:17px;text-align:left}
.dr-item svg{width:25px;height:25px}
.dr-item.sub{padding-left:62px;color:var(--fg2);font-size:16px}
.dr-sep{height:1px;background:var(--line);margin:8px 16px 8px 20px}
.dr-sec{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;font-size:14px;color:var(--fg2)}
.dr-sec button{color:var(--fg3);font-size:18px;letter-spacing:1px;padding:0 4px}
.dr-chat{display:flex;align-items:center;gap:12px;width:100%;padding:9px 20px;font-size:17px;text-align:left}
.dr-chat .ci{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden}
.dr-chat .ci img{width:100%;height:100%;object-fit:cover}
.dr-chat .ci svg{width:17px;height:17px;color:#a1a1a6}
.dr-chat span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-chat.on{background:#f4f5f7}
.dr-chat .x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);background:#f0f0f2}
.dr-chat .x svg{width:14px;height:14px;color:#666}
.dr-back{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 18px 6px 6px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.1);font-size:16px;white-space:nowrap}
.dr-back img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eef1f6}
.dr-foot{display:flex;align-items:center;gap:6px;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.dr-me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.dr-me img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #e5e5e8;background:#eef1f6}
.dr-me b{display:flex;align-items:center;gap:2px;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;min-width:0}
.dr-me b span{overflow:hidden;text-overflow:ellipsis}
.dr-me b svg{width:14px;height:14px;color:var(--fg3);flex:none}
.dr-me small{display:block;font-size:14px;color:var(--fg2);margin-top:2px}
.dr-ic{width:42px;height:42px;display:grid;place-items:center;flex:none}
.dr-ic svg{width:25px;height:25px}

/* full pages */
.page{position:absolute;inset:0;z-index:50;background:var(--bg2);transform:translateX(100%);transition:transform .34s cubic-bezier(.25,.9,.3,1);display:flex;flex-direction:column;visibility:hidden}
.page.open{transform:none;visibility:visible}
.page-top{position:absolute;inset:0 0 auto;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 12px 10px;pointer-events:none;background:linear-gradient(var(--bg2) 60%,rgba(245,245,247,0))}
.page-top>*{pointer-events:auto}
.page-top h3{margin:0;font-size:17px;font-weight:600}
.page-scroll{flex:1;overflow-y:auto;padding:76px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 20px}
.prof img{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#e9ecf2}
.prof .nm{display:flex;align-items:center;gap:2px;font-size:22px;font-weight:600;margin-top:6px}
.prof .nm svg{width:16px;height:16px;color:#b9b9be}
.prof .id{font-size:14px;color:var(--fg2)}
.prof .acc{margin-top:8px;background:#fff;border-radius:14px;padding:10px 18px;font-size:16px}
.grp{background:#fff;border-radius:20px;margin-bottom:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:0 16px;text-align:left;font-size:17px;position:relative}
.row+.row::before{content:"";position:absolute;left:64px;right:0;top:0;height:1px;background:var(--line)}
.row .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.row .ico svg{width:19px;height:19px}
.row .ico.img{overflow:hidden;border-radius:50%;background:#eef1f6}
.row .ico.img img{width:100%;height:100%;object-fit:cover}
.row .lbl{flex:1;min-width:0}
.row .val{color:var(--fg2);font-size:16px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.row .val svg{width:16px;height:16px;color:#c4c4c8}
.row .reddot{width:7px;height:7px;border-radius:50%;background:#ff3b30;display:inline-block}
.row.danger .lbl{color:var(--fg)}
.c-gray{background:linear-gradient(#8f8f94,#6c6c71)}
.c-blue{background:linear-gradient(#5b97fa,#2f6fe8)}
.c-purple{background:linear-gradient(#a57cf8,#7b4fe9)}
.c-green{background:linear-gradient(#64d36d,#36b14a)}
.c-red{background:linear-gradient(#ff7466,#ee3a2c)}
.tg{width:52px;height:32px;border-radius:999px;background:#e3e3e7;position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.tg.on{background:var(--green)}
.tg.on::after{transform:translateX(20px)}
.foot{text-align:center;font-size:13px;color:var(--fg2);line-height:2;padding:4px 0 10px}
.foot a,.foot button{color:#3b78e7;font-size:13px}

/* sheets */
.sw{position:absolute;inset:0;z-index:60;visibility:hidden}
.sw.open{visibility:visible}
.sw .sb{position:absolute;inset:0;background:rgba(20,20,26,.36);opacity:0;transition:opacity .28s}
.sw.open .sb{opacity:1}
.sw .sh{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.25,.9,.3,1);max-height:94%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sw.open .sh{transform:none}
.sh .handle{width:38px;height:5px;border-radius:9px;background:#d9d9dd;margin:9px auto 4px;flex:none}
.sh-body{overflow-y:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.sh.gray{background:var(--bg2)}
.sh h4{margin:6px 0 2px;font-size:19px;font-weight:600;text-align:center}
.sh .sub{margin:0 0 12px;text-align:center;color:var(--fg2);font-size:13.5px}

/* effort sheet */
.eff-stage{position:relative;margin:2px auto 0;width:min(78%,300px);aspect-ratio:4/5;max-width:100%;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.eff-stage canvas{width:100%;height:100%;display:block}
.eff-stage::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));pointer-events:none}
.eff-badge{z-index:1;position:absolute;left:12px;bottom:12px;right:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55);pointer-events:none}
.eff-badge b{font-size:26px;font-weight:800;letter-spacing:1px;line-height:1}
.eff-badge small{display:block;font-size:12px;opacity:.9;margin-bottom:4px;letter-spacing:1px}
.eff-badge .pw{font-size:12px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px;text-shadow:none;backdrop-filter:blur(6px)}
.eff-desc{text-align:center;font-size:15px;margin:14px 0 4px;min-height:22px}
.slider{position:relative;height:56px;margin:4px 6px 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.slider .tr{position:absolute;left:11px;right:11px;top:16px;height:8px;border-radius:9px;background:#ececf0}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#a7abb3 0%,#c7cbd3 12%,#6f9cf0 30%,#3a67d8 44%,#f2b84b 58%,#2fa8ff 72%,#ff4a4a 86%,#b06bff 100%);background-size:var(--trw,300px) 100%}
.slider .stop{position:absolute;top:16px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#cfd0d6}
.slider .stop.lit{background:rgba(255,255,255,.85)}
.slider .th{position:absolute;top:6px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.04);transition:left .18s cubic-bezier(.3,1.3,.5,1)}
.slider.drag .th{transition:none}
.slider .lb{position:absolute;top:36px;transform:translateX(-50%);font-size:12px;color:var(--fg2);white-space:nowrap}
.slider .lb.on{color:var(--fg);font-weight:600}
.eff-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.eff-stats div{background:#f6f6f8;border-radius:14px;padding:9px 6px;text-align:center}
.eff-stats small{display:block;font-size:11.5px;color:var(--fg2)}
.eff-stats b{display:block;font-size:14.5px;margin-top:2px;font-variant-numeric:tabular-nums;font-weight:600}
.pbtn{display:block;width:100%;height:50px;border-radius:999px;background:#111;color:#fff;font-size:17px;font-weight:500}
.pbtn.light{background:#f1f1f3;color:var(--fg)}
.pbtn:active{transform:scale(.99)}
.btnrow{display:flex;gap:10px}
.btnrow .pbtn{flex:1}

/* plus sheet */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:8px 0 10px}
.gi{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;color:#333}
.gi span{width:56px;height:56px;border-radius:17px;background:#f4f4f6;display:grid;place-items:center}
.gi svg{width:26px;height:26px}

/* account + form sheets */
.acc-card{background:#fff;border-radius:20px;overflow:hidden}
.acc-row{display:flex;align-items:center;gap:16px;padding:14px 18px;width:100%;text-align:left;font-size:17px}
.acc-row img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#eef1f6}
.acc-row .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center}
.acc-row .ck svg{width:16px;height:16px}
.acc-row .plus{width:56px;height:56px;border-radius:50%;border:1px solid #e3e3e6;display:grid;place-items:center;color:#9a9aa0}
.acc-row+.acc-row{border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13.5px;color:var(--fg2)}
.field input{height:46px;border-radius:12px;border:1px solid #e3e3e6;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:var(--fg)}
.av-edit{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.av-edit img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#eef1f6}
.av-edit button{border:1px solid #e3e3e6;border-radius:999px;padding:8px 14px;font-size:15px;background:#fff}

/* editor */
#editor .page-scroll{background:var(--bg2)}
.ed-intro{font-size:14px;color:#62646b;line-height:1.6;margin:0 0 12px;text-align:center}
.ed-stage{position:relative;margin:0 auto;width:min(84%,320px);aspect-ratio:4/5;max-width:100%;border-radius:22px;overflow:hidden;background:#dfe3ea;touch-action:none;box-shadow:0 8px 26px rgba(0,0,0,.12)}
.ed-stage canvas,.ed-stage svg{position:absolute;inset:0;width:100%;height:100%}
.ed-stage svg{pointer-events:none}
.ed-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#6b6e76;font-size:14px;line-height:1.7;padding:20px}
.ed-ctrl{display:grid;gap:12px;margin:16px 0 14px;background:#fff;border-radius:18px;padding:14px 16px}
.ed-ctrl label{display:flex;align-items:center;gap:12px;font-size:15px}
.ed-ctrl label span{width:44px;flex:none;color:#444}
.ed-ctrl input[type=range]{flex:1;accent-color:#111}
.ed-tip{font-size:12.5px;color:var(--fg2);text-align:center;margin:-4px 0 12px;line-height:1.6}
.ed-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.ed-strip figure{margin:0;text-align:center;font-size:12px;color:#555}
.ed-strip img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;display:block;background:#e6e8ee;margin-bottom:4px}
.ed-btns{display:grid;gap:10px}

/* transform overlay */
#xf{position:absolute;inset:0;z-index:80;background:radial-gradient(circle at 50% 42%,#1d1b2a 0%,#07070b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));color:#fff;opacity:0;transition:opacity .25s}
#xf.show{opacity:1}
#xf .xf-stage{width:min(76%,330px);aspect-ratio:4/5;max-width:100%;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 0 60px var(--xglow,rgba(255,255,255,.2))}
#xf canvas{width:100%;height:100%;display:block}
#xf .xf-lv{font-size:13px;letter-spacing:4px;opacity:.75}
#xf .xf-name{font-size:40px;font-weight:900;letter-spacing:8px;margin:-6px 0 0;text-shadow:0 0 18px var(--xglow,#fff);line-height:1.1}
#xf .xf-lines{min-height:46px;text-align:center;font-size:14.5px;line-height:1.6;opacity:.92;max-width:320px}
#xf .xf-bar{width:min(70%,280px);height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
#xf .xf-bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--xbar,#fff);box-shadow:0 0 12px var(--xglow,#fff)}
#xf .xf-skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));font-size:13px;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px}
#xf.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .5s ease forwards;pointer-events:none}

/* toast */
#toast{position:absolute;left:50%;top:44%;z-index:95;transform:translate(-50%,-50%) scale(.96);background:rgba(28,28,32,.88);color:#fff;font-size:15px;line-height:1.5;padding:11px 18px;border-radius:14px;max-width:78%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.shake{animation:shake .32s linear}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes flash{from{opacity:.95}to{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>

<div id="app">
  <header id="topbar">
    <button class="rbtn" id="btnMenu" aria-label="打开侧边栏"></button>

    <div class="home-mid"></div>
    <div class="home-rec">

      <button class="ibtn" id="btnVoice" aria-label="语音"></button>
      <button class="ibtn" id="btnPlus" aria-label="更多"></button>
      <button class="sendbtn" id="btnSend" aria-label="发送" hidden></button>

  </footer>

  <div id="popScrim" hidden></div>
  <div id="popover" hidden></div>

  <div id="scrim" hidden></div>
  <aside id="drawer" aria-label="侧边栏">

    <div class="dr-scroll" id="drScroll"></div>
    <button class="dr-back" id="drBack"><img id="drBackAv" alt="">回到主对话</button>
    <div class="dr-foot">
      <button class="dr-me" id="drMe"><img id="drMeAv" alt=""><div style="min-width:0"><b><span id="drMeName">逗包用户</span><i id="drMeChev"></i></b><small>体验套餐</small></div></button>
      <button class="dr-ic" id="drScan" aria-label="扫一扫"></button>
      <button class="dr-ic" id="drBell" aria-label="通知"></button>
      <button class="dr-ic" id="drGear" aria-label="设置"></button>
    </div>
  </aside>

  <section class="page" id="settings" aria-label="设置">
    <div class="page-top"><button class="rbtn" id="setBack" aria-label="返回"></button><button class="rbtn" id="setMore" aria-label="更多"></button></div>
    <div class="page-scroll" id="setScroll"></div>
  </section>

  <section class="page" id="editor" aria-label="生成努力形象">
    <div class="page-top"><button class="rbtn" id="edBack" aria-label="返回"></button><h3>努力形象</h3><span style="width:46px"></span></div>
    <div class="page-scroll">
      <p class="ed-intro">上传一张正脸照片，自动找到五官位置，生成从「摆烂」到「飞升」的 8 种形态。照片只存在这台手机的浏览器里，不会上传。</p>

      <div class="btnrow"><button class="pbtn light" id="cfNo">取消</button><button class="pbtn" id="cfYes">确定</button></div>
    </div>
  </div></div>

  <div id="xf" hidden>

  <input type="file" id="filePhoto" accept="image/*" hidden>

function fmtFake(sec){
  if (!isFinite(sec)) return '∞';
  if (sec < 10) return (Math.round(sec*10)/10) + ' 秒';
  if (sec < 60) return Math.round(sec) + ' 秒';
  if (sec < 3600) return Math.round(sec%60) ? Math.floor(sec/60) + ' 分 ' + Math.round(sec%60) + ' 秒' : Math.floor(sec/60) + ' 分钟';
  if (sec < 86400) return Math.floor(sec/3600) + ' 小时 ' + Math.round((sec%3600)/60) + ' 分';
  const days = sec/86400;
  if (days < 365) return Math.round(days) + ' 天';
  const yrs = days/365.25;
  if (yrs < 1e4) return Math.round(yrs) + ' 年';
  if (yrs < 1e8) return (Math.round(yrs/1e3)/10) + ' 万年';
  return (Math.round(yrs/1e7)/10) + ' 亿年';
}

/* ---------- offline brain ---------- */
const Brain = (() => {
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const CN = {'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const CNU = {'十':10,'百':100,'千':1000};
  function cnNum(s){
    if (s.includes('点')) { const [a,b] = s.split('点'); return parseFloat(cnNum(a||'零') + '.' + [...b].map(c=>CN[c]??'').join('')); }
    let total=0, section=0, num=0;
    for (const ch of s){
      if (ch in CN) num = CN[ch];
      else if (ch in CNU){ section += (num||1)*CNU[ch]; num=0; }
      else if (ch==='万'||ch==='亿'){ section += num; total += section*(ch==='万'?1e4:1e8); section=0; num=0; }
    }
    return total+section+num;
  }
  function half(q){
    return q.replace(/[！-～]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ');
  }
  /* ----- arithmetic ----- */
  function evalExpr(src){
    const t = []; let i=0;
    while (i<src.length){
      const c = src[i];
      if (/\s/.test(c)){i++;continue;}
      if (/[0-9.]/.test(c)){ let j=i; while(j<src.length && /[0-9.]/.test(src[j])) j++; const v=parseFloat(src.slice(i,j)); if(isNaN(v)) throw 0; t.push(v); i=j; continue; }
      if (src.startsWith('sqrt',i)){ t.push('s'); i+=4; continue; }
      if ('+-*/^()%!'.includes(c)){ t.push(c); i++; continue; }
      throw 0;
    }
    let p=0;
    const peek=()=>t[p], eat=()=>t[p++];
    function expr(){ let v=term(); while(peek()==='+'||peek()==='-'){ const o=eat(); const r=term(); v = o==='+'?v+r:v-r; } return v; }
    function term(){ let v=pow(); while(peek()==='*'||peek()==='/'||(typeof peek()==='number')||peek()==='('||peek()==='s'){ let o='*'; if(peek()==='*'||peek()==='/') o=eat(); const r=pow(); if(o==='/'){ if(r===0) throw 'div0'; v/=r; } else v*=r; } return v; }
    function pow(){ let b=unary(); if(peek()==='^'){ eat(); const e=pow(); b=Math.pow(b,e);} return b; }
    function unary(){ if(peek()==='-'){eat(); return -unary();} if(peek()==='+'){eat(); return unary();} return post(); }
    function post(){ let v=prim(); for(;;){ if(peek()==='%'){eat(); v/=100;} else if(peek()==='!'){eat(); if(v<0||v>170||v%1) throw 0; let f=1; for(let k=2;k<=v;k++) f*=k; v=f;} else break; } return v; }
    function prim(){
      const x=eat();
      if (typeof x==='number') return x;
      if (x==='('){ const v=expr(); if(eat()!==')') throw 0; return v; }
      if (x==='s'){ const v=post(); if(v<0) throw 'neg'; return Math.sqrt(v); }
      throw 0;
    }
    const v = expr();
    if (p!==t.length) throw 0;
    return v;
  }
  function fmtNum(v){
    if (!isFinite(v)) return '∞';
    if (Math.abs(v) >= 1e15 || (Math.abs(v) < 1e-6 && v !== 0)) return v.toExponential(6).replace(/\.?0+e/,'e');
    const r = Math.round(v*1e8)/1e8;
    return String(r);
  }
  function tryMath(raw){
    let q = half(raw).replace(/[，,]/g,'').replace(/[？?。！!～~]/g,'').trim();
    if (!/[0-9零〇一二两三四五六七八九十百千万亿]/.test(q)) return null;
    if (!/[+\-*/^×÷xX%!]|加|减|乘|除|平方|立方|次方|根号|开方|阶乘|百分之/.test(q)) return null;
    let s = q
      .replace(/请问|帮我|帮忙|麻烦|计算一下|计算|算一下|算算|算|一下|你知道|告诉我|那么|的话/g,'')
      .replace(/等于多少|等于几|是多少|是几|得多少|得几|等于啥|等于什么|结果是|多少|等于|=|是/g,'')
      .replace(/百分之([零〇一二两三四五六七八九十百千点0-9.]+)/g,'$1%')
      .replace(/根号下?|开根号|开方/g,'sqrt')
      .replace(/的平方根/g,'#SQ#')
      .replace(/的平方|平方/g,'^2').replace(/的立方|立方/g,'^3')
      .replace(/的([零〇一二两三四五六七八九十0-9]+)次方/g,'^$1').replace(/([零〇一二两三四五六七八九十0-9]+)次方/g,'^$1')
      .replace(/的阶乘|阶乘/g,'!')
      .replace(/加上|加/g,'+').replace(/减去|减/g,'-').replace(/乘以|乘上|乘/g,'*').replace(/除以|除/g,'/')
      .replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/（/g,'(').replace(/）/g,')')
      .replace(/[吗呢呀啊吧嘛哈]/g,'').trim();
    s = s.replace(/[零〇一二两三四五六七八九十百千万亿点]+/g, m => (m==='点'?'.':String(cnNum(m))));
    s = s.replace(/([0-9.]+|\([^()]*\))#SQ#/g,'sqrt($1)').replace(/#SQ#/g,'');
    if (!/^[0-9+\-*/^().%!\s]+$/.test(s.replace(/sqrt/g,''))) return null;
    s = s.replace(/\s+/g,'');
    if (!/[0-9]/.test(s) || !/[+\-*/^%!]|sqrt/.test(s)) return null;
    try {
      const v = evalExpr(s);
      const pretty = s.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/(\d)-/g,'$1 - ').replace(/sqrt/g,'√');
      return {a: `${pretty} = ${fmtNum(v)}`, kind:'math', v};
    } catch(e){
      if (e==='div0') return {a:'除以 0 是没有意义的。真要算的话，宇宙会先崩掉。', kind:'math'};
      if (e==='neg') return {a:'负数在实数范围里没有平方根，得请出虚数 i 才行。', kind:'math'};
      return null;
    }
  }
  /* ----- units ----- */
  const UNITS = {
    '毫米':['L',.001],'厘米':['L',.01],'分米':['L',.1],'米':['L',1],'公里':['L',1000],'千米':['L',1000],'km':['L',1000],'cm':['L',.01],'mm':['L',.001],'m':['L',1],
    '英寸':['L',.0254],'寸':['L',1/30],'尺':['L',1/3],'英尺':['L',.3048],'英里':['L',1609.344],'海里':['L',1852],'里':['L',500],
    '克':['M',1],'g':['M',1],'千克':['M',1000],'公斤':['M',1000],'kg':['M',1000],'斤':['M',500],'两':['M',50],'吨':['M',1e6],'磅':['M',453.59237],'盎司':['M',28.3495],
    '秒':['T',1],'分钟':['T',60],'小时':['T',3600],'天':['T',86400],'星期':['T',604800],'周':['T',604800],'年':['T',31536000],
    'B':['D',1],'KB':['D',1024],'MB':['D',1048576],'GB':['D',1073741824],'TB':['D',1099511627776],
    '平方米':['A',1],'平方公里':['A',1e6],'公顷':['A',1e4],'亩':['A',666.667],'平方厘米':['A',1e-4],

const pico = {};

pico.unpack_cascade = function(bytes)
{
	//
	const dview = new DataView(new ArrayBuffer(4));
	/*
		we skip the first 8 bytes of the cascade file
		(cascade version number and some data used during the learning process)
	*/
	let p = 8;
	/*
		read the depth (size) of each tree first: a 32-bit signed integer
	*/
	dview.setUint8(0, bytes[p+0]), dview.setUint8(1, bytes[p+1]), dview.setUint8(2, bytes[p+2]), dview.setUint8(3, bytes[p+3]);
	const tdepth = dview.getInt32(0, true);
	p = p + 4
	/*
		next, read the number of trees in the cascade: another 32-bit signed integer
	*/
	dview.setUint8(0, bytes[p+0]), dview.setUint8(1, bytes[p+1]), dview.setUint8(2, bytes[p+2]), dview.setUint8(3, bytes[p+3]);
	const ntrees = dview.getInt32(0, true);
	p = p + 4
	/*
		read the actual trees and cascade thresholds
	*/
	const tcodes_ls = [];
	const tpreds_ls = [];
	const thresh_ls = [];
	for(let t=0; t<ntrees; ++t)
	{
		// read the binary tests placed in internal tree nodes
		Array.prototype.push.apply(tcodes_ls, [0, 0, 0, 0]);
		Array.prototype.push.apply(tcodes_ls, bytes.slice(p, p+4*Math.pow(2, tdepth)-4));
		p = p + 4*Math.pow(2, tdepth)-4;
		// read the prediction in the leaf nodes of the tree
		for(let i=0; i<Math.pow(2, tdepth); ++i)
		{
			dview.setUint8(0, bytes[p+0]), dview.setUint8(1, bytes[p+1]), dview.setUint8(2, bytes[p+2]), dview.setUint8(3, bytes[p+3]);
			tpreds_ls.push(dview.getFloat32(0, true));
			p = p + 4;
		}
		// read the threshold
		dview.setUint8(0, bytes[p+0]), dview.setUint8(1, bytes[p+1]), dview.setUint8(2, bytes[p+2]), dview.setUint8(3, bytes[p+3]);
		thresh_ls.push(dview.getFloat32(0, true));
		p = p + 4;
	}
	const tcodes = new Int8Array(tcodes_ls);
	const tpreds = new Float32Array(tpreds_ls);
	const thresh = new Float32Array(thresh_ls);
	/*
		construct the classification function from the read data
	*/
	function classify_region(r, c, s, pixels, ldim)
	{
		 r = 256*r;
		 c = 256*c;
		 let root = 0;
		 let o = 0.0;
		 const pow2tdepth = Math.pow(2, tdepth) >> 0; // '>>0' transforms this number to int

		 for(let i=0; i<ntrees; ++i)
		 {
			let idx = 1;
			for(let j=0; j<tdepth; ++j)
				// we use '>> 8' here to perform an integer division: this seems important for performance
				idx = 2*idx + (pixels[((r+tcodes[root + 4*idx + 0]*s) >> 8)*ldim+((c+tcodes[root + 4*idx + 1]*s) >> 8)]<=pixels[((r+tcodes[root + 4*idx + 2]*s) >> 8)*ldim+((c+tcodes[root + 4*idx + 3]*s) >> 8)]);

			 o = o + tpreds[pow2tdepth*i + idx-pow2tdepth];

			 if(o<=thresh[i])
				 return -1;

			 root += 4*pow2tdepth;
		}
		return o - thresh[ntrees-1];
	}
	/*
		we're done
	*/
	return classify_region;
}

pico.run_cascade = function(image, classify_region, params)
{
	const pixels = image.pixels;
	const nrows = image.nrows;
	const ncols = image.ncols;
	const ldim = image.ldim;

	const shiftfactor = params.shiftfactor;
	const minsize = params.minsize;
	const maxsize = params.maxsize;
	const scalefactor = params.scalefactor;

	let scale = minsize;
	const detections = [];

	while(scale<=maxsize)
	{
		const step = Math.max(shiftfactor*scale, 1) >> 0; // '>>0' transforms this number to int
		const offset = (scale/2 + 1) >> 0;

		for(let r=offset; r<=nrows-offset; r+=step)
			for(let c=offset; c<=ncols-offset; c+=step)
			{
				const q = classify_region(r, c, scale, pixels, ldim);
				if (q > 0.0)
					detections.push([r, c, scale, q]);
			}
		
		scale = scale*scalefactor;
	}

    return detections;
}

pico.cluster_detections = function(dets, iouthreshold)
{
	/*
		sort detections by their score
	*/
	dets = dets.sort(function(a, b) {
		return b[3] - a[3];
	});
	/*
		this helper function calculates the intersection over union for two detections
	*/
	function calculate_iou(det1, det2)
	{
		// unpack the position and size of each detection
		const r1=det1[0], c1=det1[1], s1=det1[2];
		const r2=det2[0], c2=det2[1], s2=det2[2];
		// calculate detection overlap in each dimension
		const overr = Math.max(0, Math.min(r1+s1/2, r2+s2/2) - Math.max(r1-s1/2, r2-s2/2));
		const overc = Math.max(0, Math.min(c1+s1/2, c2+s2/2) - Math.max(c1-s1/2, c2-s2/2));
		// calculate and return IoU
		return overr*overc/(s1*s1+s2*s2-overr*overc);
	}
	/*
		do clustering through non-maximum suppression
	*/
	const assignments = new Array(dets.length).fill(0);
	const clusters = [];
	for(let i=0; i<dets.length; ++i)
	{
		// is this detection assigned to a cluster?
		if(assignments[i]==0)
		{
			// it is not:
			// now we make a cluster out of it and see whether some other detections belong to it
			let r=0.0, c=0.0, s=0.0, q=0.0, n=0;
			for(let j=i; j<dets.length; ++j)
				if(calculate_iou(dets[i], dets[j])>iouthreshold)
				{
					assignments[j] = 1;
					r = r + dets[j][0];
					c = c + dets[j][1];
					s = s + dets[j][2];
					q = q + dets[j][3];
					n = n + 1;
				}
			// make a cluster representative
			clusters.push([r/n, c/n, s/n, q]);
		}
	}

	return clusters;
}

/* ---------- live canvases ---------- */
const Live = (() => {
  const set = new Set(); let raf=0, last=0;
  function add(canvas, getLevel, opt={}){ const o={canvas, getLevel, st:newState(), crop:opt.crop||null, small:!!opt.small, onZap:opt.onZap}; o.st.onZap=opt.onZap; set.add(o); start(); return o; }
  function remove(o){ set.delete(o); }
  function start(){ if (!raf){ last=performance.now(); raf=requestAnimationFrame(loop); } }
  function loop(now){
    const dt = Math.min(.05, (now-last)/1000); last=now; const t = now/1000;
    let any=false;
    for (const o of set){
      if (!o.canvas.isConnected){ set.delete(o); continue; }
      if (!o.canvas.offsetParent && o.canvas.getClientRects().length===0) continue;
      any=true;
      const r = o.canvas.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio||1);
      const W = Math.max(1, Math.round(r.width*dpr)), H = Math.max(1, Math.round(r.height*dpr));
      if (o.canvas.width!==W || o.canvas.height!==H){ o.canvas.width=W; o.canvas.height=H; }
      const x = o.canvas.getContext('2d');
      const C = App.char();
      const crop = o.crop==='face' ? C.anch.crop : [0,0,CW,CH];
      const s = Math.max(W/crop[2], H/crop[3]);
      x.setTransform(s,0,0,s, -crop[0]*s + (W-crop[2]*s)/2, -crop[1]*s + (H-crop[3]*s)/2);
      x.clearRect(crop[0]-20,crop[1]-20,crop[2]+40,crop[3]+40);
      paintFrame(x, C, o.st, o.getLevel(), t, dt, o.small);
    }
    raf = set.size ? requestAnimationFrame(loop) : 0;
  }
  function flash(o){ if(o) o.st.flash=1; }
  function reset(o){ if(o){ const z=o.st.onZap; o.st=newState(); o.st.onZap=z; } }
  return {add, remove, flash, reset};
})();

/* ---------- face finding ---------- */
async function findFace(img){
  const iw=img.naturalWidth, ih=img.naturalHeight;
  try {
    if ('FaceDetector' in window){
      const fd = new window.FaceDetector({fastMode:true, maxDetectedFaces:4});
      const fs = await fd.detect(img);
      if (fs && fs.length){
        fs.sort((a,b)=>b.boundingBox.width*b.boundingBox.height - a.boundingBox.width*a.boundingBox.height);
        const f=fs[0], bb=f.boundingBox;
        const eyes = (f.landmarks||[]).filter(l=>l.type==='eye').map(l=> l.locations ? l.locations.reduce((a,p)=>({x:a.x+p.x/l.locations.length, y:a.y+p.y/l.locations.length}),{x:0,y:0}) : l.location).filter(Boolean);
        if (eyes.length>=2){ eyes.sort((a,b)=>a.x-b.x); return {eyes:[eyes[0],eyes[eyes.length-1]], how:'face'}; }
        return {box:{x:bb.x,y:bb.y,w:bb.width,h:bb.height}, eyeFrac:.40, how:'face'};
      }
    }
  } catch(e){}
  const fa = await faFace(img);
  if (fa) return fa;
  const pd = await picoFace(img, iw, ih);
  if (pd) return pd;
  return skinFace(img, iw, ih);
}
/* face-api (tiny detector + 68 landmarks), loaded only when a photo is used */
let FA = null;
function loadFaceApi(){

async function faFace(img){
  try {
    if (!(await loadFaceApi())) return null;
    const out = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({inputSize:512, scoreThreshold:.3})).withFaceLandmarks(true);
    if (!out || !out.length) return null;
    out.sort((a,b)=> b.detection.box.width*b.detection.score - a.detection.box.width*a.detection.score);
    const lm = out[0].landmarks;
    const avg = pts => pts.reduce((a,p)=>({x:a.x+p.x/pts.length, y:a.y+p.y/pts.length}),{x:0,y:0});
    const eyes = [avg(lm.getLeftEye()), avg(lm.getRightEye())].sort((a,b)=>a.x-b.x);

  } catch(e){ return null; }
}

async function picoFace(img, iw, ih){

  async function answer(q){
    const c = chat(S.cur); if (!c) return;
    busy = true; hurry = false; syncInput();
    const L = S.level, lv = LEVELS[L];
    if (S.quota >= 100){
      const m = {r:'b', L, t:'本时段的努力额度已经用完了。\n\n点左下角「对话 › 当前时段额度用量」可以免费充值，或者先摆烂一会儿（Lv0 不耗额度）。', think:[], fake:0, done:true, intro:true};
      if (L===0){ /* lazy mode costs nothing */ } else { c.msgs.push(m); saveChats(); $('#msgs').appendChild(botEl(m,false)); scrollEnd(); busy=false; syncInput(); return; }
    }
    S.quota = Math.min(100, S.quota + lv.cost); store.set('quota', S.quota);
    const r = Brain.answer(q, S.bot);
    const m = {r:'b', L, t:Brain.wrap(L, r), think:Brain.thinking(L, q), fake:lv.fake, done:false};
    if (L>=4 && !RM) await XF.play(L, q);
    const el = botEl(m, true); $('#msgs').appendChild(el); scrollEnd();
    const th = el.querySelector('.think'), body = el.querySelector('.think-b'), lb = el.querySelector('.lb'), tm = el.querySelector('.tm');
    let liveO = null; const cv = el.querySelector('.av canvas');
    if (cv) liveO = Live.add(cv, ()=>L, {crop:'face', small:true});
    if (L>0){
      const total = lv.think, t0 = performance.now(); let shown = 0;
      const lines = m.think;
      await new Promise(res=>{
        function tick(){
          const e = performance.now()-t0, p = hurry ? 1 : Math.min(1, e/total);
          const fake = Math.expm1(p*Math.log1p(lv.fake));
          tm.textContent = fmtFake(fake);
          const want = Math.min(lines.length, Math.floor(p*lines.length*1.02)+ (p>0?1:0));
          while (shown < want){ const pe=document.createElement('p'); pe.className='new'; pe.textContent=lines[shown++]; body.appendChild(pe); scrollEnd(); }
          if (p>=1) return res();
          requestAnimationFrame(tick);
        }
        tick();
      });
    } else {
      await sleep(hurry?0:900);
    }
    while (body.children.length < m.think.length){ const pe=document.createElement('p'); pe.textContent=m.think[body.children.length]; body.appendChild(pe); }
    lb.textContent = thinkLabel(m); tm.textContent='';
    if (liveO) Live.remove(liveO);
    el.querySelector('.av').innerHTML = `<img src="${thumb(L)}" alt="">`;
    if (!m.think.length) el.querySelector('.chev').style.visibility='hidden';
    if (L<=1) th.classList.add('closed');
    // type the answer
    const ans = el.querySelector('.ans');
    const step = L===0 ? 1 : L===1 ? 4 : 2, delay = L===0 ? 55 : L===1 ? 14 : 22;
    for (let i=0;i<=m.t.length;i+=step){
      if (hurry) break;
      ans.innerHTML = md(m.t.slice(0,i)); ans.lastElementChild && ans.lastElementChild.insertAdjacentHTML('beforeend','<span class="caret"></span>');
      if (i%12===0) scrollEnd();
      await sleep(delay);
    }
    ans.innerHTML = md(m.t);
    m.done = true; c.msgs.push(m); c.ts = Date.now(); saveChats();
    el.appendChild(actsEl(m));
    $('#msgs').appendChild(followEl());
    scrollEnd();
    busy = false; hurry = false; syncInput();
    renderChips();
  }

/* ---------- transformation overlay (Lv4+) ---------- */
const XF = (() => {
  let curL = 1, o = null;
  function play(L, q){
    return new Promise(res=>{
      const box = $('#xf'), lv = LEVELS[L];
      box.hidden = false; requestAnimationFrame(()=>box.classList.add('show'));
      box.style.setProperty('--xglow', lv.glow); box.style.setProperty('--xbar', lv.bar);
      $('#xfLv').textContent = `努力程度 · LV${L}`; $('#xfName').textContent = '…';
      const lines = $('#xfLines'); lines.textContent = `目标问题：「${Brain.short(q)}」`;
      const bar = $('#xfBar'); bar.style.width='0%';
      curL = 1; o = Live.add($('#xfCanvas'), ()=>curL, {onZap:()=>Snd.zap()});
      const steps = [1]; for (let k=4;k<=L;k++) steps.push(k);
      const per = 520, hold = 900, total = 450 + (steps.length-1)*per + hold;
      Snd.charge(total/1000*.85);
      let done=false; const timers=[];
      const finish = () => {
        if (done) return; done=true; timers.forEach(clearTimeout);
        box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
        setTimeout(()=>{ box.classList.remove('show'); setTimeout(()=>{ box.hidden=true; box.classList.remove('flash'); if (o){ Live.remove(o); o=null; } res(); }, 260); }, 180);
      };
      $('#xfSkip').onclick = finish; box.onclick = e => { if (e.target.id!=='xfSkip') finish(); };
      const t0 = performance.now();
      (function barTick(){ if (done) return; const p=Math.min(1,(performance.now()-t0)/total); bar.style.width=(p*100)+'%'; if (p<1) requestAnimationFrame(barTick); })();
      steps.forEach((s,i)=>{
        if (i===0) return;
        timers.push(setTimeout(()=>{
          curL = s; Live.flash(o); Snd.boom(); vibrate(s>=6?[40,30,60]:30);
          $('#xfName').textContent = LEVELS[s].n;
          const st=$('#xf .xf-stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
          lines.textContent = s===L ? `${lv.desc}！` : (i===1 ? '努力程度提升中……' : `突破 Lv${s} ${LEVELS[s].n}！`);
        }, 450 + (i-1)*per));
      });
      if (steps.length===1){ curL=L; $('#xfName').textContent=lv.n; }
      timers.push(setTimeout(finish, total));
    });
  }
  return {play};
})();

  const cv = $('#edCanvas'), cx = cv.getContext('2d');
  function draw(){
    cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,CW,CH);
    if (img) drawPhotoCard(cx, img, T); else drawBunScene(cx);
    $('#edEmpty').hidden = !!img; $('#edGuide').style.display = img ? '' : 'none';
    $('#edTip').style.visibility = img ? 'visible' : 'hidden';
    $('#edZoom').disabled = $('#edRot').disabled = $('#edAuto').disabled = !img;
  }
  function syncSliders(){ if (!img||!base) return; $('#edZoom').value = Math.round(T.s/base.s*100); $('#edRot').value = Math.round((T.rot-base.rot)*180/Math.PI); }
  function open(){
    loadFaceApi();
    const p = store.get('photo', null);
    $('#edStrip').innerHTML='';
    if (p && p.src){
      const im=new Image(); im.onload=()=>{ img=im; src=p.src; T={...p.T}; base=p.base?{...p.base}:{...p.T}; draw(); syncSliders(); }; im.src=p.src;
    } else { img=null; src=null; T=null; draw(); }
    $('#editor').classList.add('open');
  }
  function close(){ $('#editor').classList.remove('open'); }
  function pick(){ loadFaceApi(); $('#filePhoto').click(); }
  async function load(file){
    try {
      const url = await App.shrinkFile(file, 900, .88);
      const im = new Image();
      await new Promise((r,j)=>{ im.onload=r; im.onerror=j; im.src=url; });
      img = im; src = url;
      if (!$('#editor').classList.contains('open')) { $('#edStrip').innerHTML=''; $('#editor').classList.add('open'); }
      toast('正在识别五官…（第一次会慢一点）', 4000);
      det = await findFace(im);
      T = autoT(det); base = {...T};
      draw(); syncSliders();
      toast(det.how==='center' ? '没认出脸，请手动拖到虚线框里' : det.how==='ai'||det.how==='face' ? '已找到五官并自动对齐' : '已大致对齐，可以再微调一下');
    } catch(e){ toast('这张图片打不开，换一张 JPG 或 PNG 试试'); }
  }
  $('#filePhoto').onchange = e => { const f=e.target.files[0]; e.target.value=''; if (f) load(f); };
  $('#edBack').onclick = close;
  $('#edPick').onclick = pick;
  $('#edAuto').onclick = async () => { if (!img) return; det = await findFace(img); T = autoT(det); base={...T}; draw(); syncSliders(); toast('已重新识别'); };
  $('#edReset').onclick = () => { store.del('photo'); img=null; src=null; T=null; draw(); App.setChar(buildCharacter(null)); $('#edStrip').innerHTML=''; toast('已换回默认的包子形象'); };
  $('#edZoom').oninput = e => { if (!img) return; T.s = base.s*(+e.target.value)/100; draw(); };
  $('#edRot').oninput = e => { if (!img) return; T.rot = base.rot + (+e.target.value)*Math.PI/180; draw(); };
  $('#edSave').onclick = async () => {
    if (!img){ pick(); return; }
    const ok = store.set('photo', {src, T, base});
    if (!ok) toast('手机存储空间不够，这次能用，刷新后会丢失');
    const C = buildCharacter({img, T});
    App.setChar(C);
    const strip = $('#edStrip'); strip.innerHTML = [0,2,5,7].map(L=>`<figure><img src="${levelThumb(C,L,200)}" alt="">${LEVELS[L].n}</figure>`).join('');
    toast('努力形象已生成！');
    await sleep(1100);
    close(); App.openEffort(true);
  };
  // drag + pinch on the stage
  const stage = $('#edStage'); const pts = new Map(); let lastD = 0, lastMid=null;
  stage.addEventListener('pointerdown', e => { if (!img) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if (pts.size===2){ const [a,b]=[...pts.values()]; lastD=Math.hypot(a.x-b.x,a.y-b.y); } });
  stage.addEventListener('pointermove', e => {
    if (!img || !pts.has(e.pointerId)) return;
    const k = CW / stage.clientWidth;
    const prev = pts.get(e.pointerId); const cur={x:e.clientX,y:e.clientY};
    if (pts.size===1){ T.x += (cur.x-prev.x)*k; T.y += (cur.y-prev.y)*k; }
    pts.set(e.pointerId, cur);
    if (pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if (lastD) T.s *= d/lastD; lastD=d; syncSliders(); }
    draw();
  });
  const up = e => { pts.delete(e.pointerId); lastD=0; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { if (!img) return; e.preventDefault(); T.s *= e.deltaY<0 ? 1.05 : 1/1.05; syncSliders(); draw(); }, {passive:false});
  return {open, close, pick};
})();

App.init();

</script>
</body>
</html>
