        row('toggles','c-blue','默认开启模式', S.defMode==='chat'?'对话':'工作', ()=>{ S.defMode = S.defMode==='chat'?'work':'chat'; store.set('defMode',S.defMode); renderSettings(); }, {updown:true}),
        row('model','c-purple','新对话默认努力程度', `Lv${S.level} ${lv.n}`, ()=>openEffort()),
        row('cursor','c-blue','工作模式设置','',()=>toast('工作模式：自动把摸鱼包装成成果')),
        row('keyboard','c-green','键盘回车键行为', S.enterSend?'发送消息':'换行', ()=>{ S.enterSend=!S.enterSend; store.set('enter',S.enterSend); renderSettings(); }, {updown:true}),
        row('spark','c-blue','内容生成与产物设置','',()=>toast('产物：一个努力的回答')) ],
      [ row('flower','c-green','未成年人模式','',()=>toast('未成年人模式：努力程度上限 Lv3，早点睡觉')), row('play','c-blue','回答展示相关视频', null, ()=>{ S.videos=!S.videos; store.set('videos',S.videos); renderSettings(); toast(S.videos?'已开启，但没有视频':'已关闭'); }, {toggle:S.videos}) ],
      [ row('folder','c-blue','云盘存储', storageSize(), ()=>toast('云盘里只有你的努力')), row('wallet','c-blue','钱包','',()=>toast('余额：0.00 元，努力值：充足')), row('cart','c-blue','我的订单','',()=>toast('暂无订单。努力是买不到的。')) ],
      [ row('archive','c-green','已归档内容','',()=>toast('没有归档内容')) ],
      [ row('broom','c-green','清理缓存', storageSize(), ()=>confirmSheet('清空所有对话？','照片和设置会保留，只删除聊天记录。','清空').then(ok=>{ if(ok){ S.chats=seed(); saveChats(); showHome(); renderSettings(); toast('已清理'); } })),
        row('lock','c-blue','隐私与权限','',()=>toast('照片和聊天只存在这台手机的浏览器里，不会上传')),
        row('flag','c-purple','帮助与反馈','',()=>toast('有问题？把努力程度调高再问一遍')),
        row('globe','c-purple','逗包官网','',()=>toast('你现在就在官网')),
        row('info','c-blue','关于逗包','',()=>confirmSheet('关于逗包','朋友之间的恶搞作品，跟任何真实产品都没有关系。回答由页面里的离线小脑袋生成，智力固定，努力可调。','知道了')),
        row('device','c-green','我的智能设备','',()=>toast('检测到 1 台设备：你的手机')),
        row('bulb','c-purple','快捷指令', '逗包截屏拍题答疑', ()=>toast('快捷指令：摇一摇手机，努力 +1'), {dot:true}) ],
      [ row('swap','c-gray','切换账号','',()=>openSheet('#swAccount')), row('logout','c-red','退出登录','',()=>toast('退出失败：你还没努力够'), {noChev:true}) ],
    ];
    const ua = S.user.avatar || DEFAULT_AV;
    let html = `<div class="prof"><img src="${ua}" alt=""><button class="nm" data-k="pf">${esc(S.user.name)}${ic('chev',16,2.2)}</button><div class="id">逗包号: ${esc(S.user.id)}</div><button class="acc" data-k="pf">逗包账号管理</button></div>`;
    const acts = [];
    for (const g of groups){
      html += '<div class="grp">';
      for (const r of g){
        const i = acts.push(r.act)-1;
        const icon = r.icon==='IMG' ? `<span class="ico img"><img src="${thumb(1)}" alt=""></span>` : `<span class="ico ${r.color}">${ic(r.icon,19,2)}</span>`;
        let right = '';
        if (r.opt.toggle!==undefined) right = `<span class="tg ${r.opt.toggle?'on':''}"></span>`;
        else right = `<span class="val">${r.val?esc(r.val):''}${r.opt.dot?'<span class="reddot"></span>':''}${r.opt.noChev?'':ic(r.opt.updown?'updown':'chev',16,2.2)}</span>`;
        html += `<button class="row" data-i="${i}">${icon}<span class="lbl">${esc(r.label)}</span>${right}</button>`;
      }
      html += '</div>';
    }
    html += `<div class="foot">Version: 15.4.0（恶搞版）<br><button data-k="about">由 努力大模型 提供支持</button><br><button data-k="list">《个人信息清单》</button><button data-k="list">《三方信息共享清单》</button></div>`;
    const sc = $('#setScroll'); const top = sc.scrollTop; sc.innerHTML = html; sc.scrollTop = top;
    sc.onclick = e => {
      const b = e.target.closest('[data-i],[data-k]'); if (!b) return;
      if (b.dataset.i!==undefined) return acts[+b.dataset.i]();
      if (b.dataset.k==='pf') openProfile();
      if (b.dataset.k==='about') toast('努力大模型：参数量 0，努力程度 ∞');
      if (b.dataset.k==='list') toast('个人信息：只存在你的手机里');
    };
  }
  function storageSize(){ try { let n=0; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k.startsWith('nuli_')) n += (localStorage.getItem(k)||'').length; } return (n/1048576*2).toFixed(2)+' MB'; } catch(e){ return '0 MB'; } }
  function openSettings(){ renderSettings(); $('#settings').classList.add('open'); }
  function closeSettings(){ $('#settings').classList.remove('open'); }

  /* ---------- profile sheet ---------- */
  let pfAv = null;
  function openProfile(){
    pfAv = S.user.avatar; $('#pfAv').src = pfAv || DEFAULT_AV; $('#pfName').value = S.user.name; $('#pfBot').value = S.bot;
    openSheet('#swProfile');
  }
  $('#pfPick').onclick = () => $('#fileAvatar').click();
  $('#pfClear').onclick = () => { pfAv=null; $('#pfAv').src=DEFAULT_AV; };
  $('#fileAvatar').onchange = async e => { const f=e.target.files[0]; e.target.value=''; if(!f) return; try { const url = await shrinkFile(f, 320, .85); pfAv=url; $('#pfAv').src=url; } catch(err){ toast('这张图片打不开，换一张试试'); } };
  $('#pfSave').onclick = () => {
    S.user.name = $('#pfName').value.trim() || '逗包用户'; S.user.avatar = pfAv;
    S.bot = $('#pfBot').value.trim() || '逗包';
    if (!store.set('user', S.user)) { S.user.avatar=null; store.set('user', S.user); toast('头像太大存不下，已保存名字'); }
    store.set('bot', S.bot);
    closeSheet('#swProfile'); avatarsRefresh(); renderSettings(); toast('已保存');
  };

  /* ---------- file helper ---------- */
  function shrinkFile(file, max, q){
    return new Promise((res,rej)=>{
      const url = URL.createObjectURL(file); const im=new Image();
      im.onload=()=>{ const s=Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight)); const c=mkC(im.naturalWidth*s, im.naturalHeight*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); try { res(c.toDataURL('image/jpeg', q)); } catch(e){ rej(e); } };
      im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); };
      im.src=url;
    });
  }

  function toggleSound(){ S.sound=!S.sound; store.set('sound',S.sound); paintSound(); if (S.sound){ Snd.unlock(); Snd.blip(3); toast('音效已开启'); } else toast('音效已关闭'); }

  /* ---------- wiring ---------- */
  function wire(){
    $('#btnMenu').onclick = openDrawer;
    $('#scrim').onclick = closeDrawer;
    $('#btnSound').onclick = toggleSound;
    $('#drBack').onclick = () => { closeDrawer(); showChat('main'); };
    $('#drMe').onclick = () => { closeDrawer(); openSettings(); };
    $('#drGear').onclick = () => { closeDrawer(); openSettings(); };
    $('#drScan').onclick = () => toast('扫一扫：请对准朋友的脸');
    $('#drBell').onclick = () => toast('暂无通知，大家都在努力');
    $('#drSearch').onclick = () => toast('搜索：你要找的答案，其实是 2');
    $('#setBack').onclick = () => { closeSettings(); };
    $('#setMore').onclick = async () => { const ok = await copyText(location.href); toast(ok ? '链接已复制，发给朋友吧' : '复制失败'); };
    $('#popScrim').onclick = closePop;
    $('#seg').onclick = e => { const b=e.target.closest('button'); if (b) setMode(b.dataset.mode); };
    $('#btnCam').onclick = () => Editor.pick();
    $('#btnVoice').onclick = () => toast('按住说话：逗包的耳朵还在努力生长');
    $('#btnPlus').onclick = () => openSheet('#swPlus');
    $('#btnSend').onclick = () => { if (busy && !inp.value.trim()){ hurry=true; return; } send(); };
    $('#accMe').onclick = () => closeSheet('#swAccount');
    $('#accAdd').onclick = () => toast('一个人努力就够了');
    inp.addEventListener('input', syncInput);
    inp.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey && S.enterSend && !e.isComposing){ e.preventDefault(); send(); } });
    $('#topTitle').onclick = () => openEffort();
    const PLUS = [
      ['img','相册',()=>Editor.pick()],['camera','拍照',()=>Editor.pick()],['file','文件',()=>toast('文件也在努力中')],['bolt','努力程度',()=>openEffort()],
      ['pimg','努力形象',()=>Editor.open()],['spark','形态预览',()=>openEffort(true)],['chatplus','新对话',()=>showHome()],['trash','清空当前',()=>{ const c=chat(S.cur); if(!c) return toast('当前没有对话'); confirmSheet('清空这个对话？','','清空').then(ok=>{ if(ok){ c.msgs=c.id==='main'?seed()[0].msgs:[]; saveChats(); renderMsgs(); } }); }],
    ];
    const g=$('#plusGrid'); g.innerHTML = PLUS.map((p,i)=>`<button class="gi" data-i="${i}"><span>${ic(p[0],26)}</span>${p[1]}</button>`).join('');
    g.onclick = e => { const b=e.target.closest('[data-i]'); if(!b) return; closeSheet('#swPlus'); setTimeout(PLUS[+b.dataset.i][2], 180); };
    window.addEventListener('resize', ()=>{ const sl=$('#effSlider'); if (sl._place){ sl._place(); effortUI(); } });
    // keep the shell pinned: iOS keyboards and programmatic focus can scroll overflow-hidden containers
    const pin = el => el.addEventListener('scroll', ()=>{ if (el.scrollTop || el.scrollLeft){ el.scrollTop = 0; el.scrollLeft = 0; } });
    pin($('#app')); pin(document.documentElement); pin(document.body);

  async function init(){
    paintIcons(); applyFont(); wire();
    await loadPhoto();
    avatarsRefresh();

  }
  return {S, init, char:()=>CHAR, setChar(c){ CHAR=c; avatarsRefresh(); if (S.cur) renderMsgs(); }, openEffort, showHome, showChat, toast, shrinkFile, renderSettings};
})();

/* ---------- transformation overlay (Lv4+) ---------- */
const XF = (() => {
  let curL = 1, o = null;
  function play(L, q){
    return new Promise(res=>{
      const box = $('#xf'), lv = LEVELS[L];
      box.hidden = false; requestAnimationFrame(()=>box.classList.add('show'));
      box.style.setProperty('--xglow', lv.glow); box.style.setProperty('--xbar', lv.bar);
      $('#xfLv').textContent = `努力程度 · LV${L}`; $('#xfName').textContent = '…';
      const lines = $('#xfLines'); lines.textContent = `目标问题：「${q.length>14 ? q.slice(0,14)+'…' : q}」`;
      const bar = $('#xfBar'); bar.style.width='0%';
      curL = 1; o = Live.add($('#xfCanvas'), ()=>curL, {onZap:()=>Snd.zap()});
      const steps = [1]; for (let k=4;k<=L;k++) steps.push(k);
      const per = 520, hold = 900, total = 450 + (steps.length-1)*per + hold;
      Snd.charge(total/1000*.85);
      let done=false; const timers=[];
      const finish = () => {
        if (done) return; done=true; timers.forEach(clearTimeout);
        box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
        setTimeout(()=>{ box.classList.remove('show'); setTimeout(()=>{ box.hidden=true; box.classList.remove('flash'); if (o){ Live.remove(o); o=null; } res(); }, 260); }, 180);
      };
      $('#xfSkip').onclick = finish; box.onclick = e => { if (e.target.id!=='xfSkip') finish(); };
      const t0 = performance.now();
      (function barTick(){ if (done) return; const p=Math.min(1,(performance.now()-t0)/total); bar.style.width=(p*100)+'%'; if (p<1) requestAnimationFrame(barTick); })();
      steps.forEach((s,i)=>{
        if (i===0) return;
        timers.push(setTimeout(()=>{
          curL = s; Live.flash(o); Snd.boom(); vibrate(s>=6?[40,30,60]:30);
          $('#xfName').textContent = LEVELS[s].n;
          const st=$('#xf .xf-stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
          lines.textContent = s===L ? `${lv.desc}！` : (i===1 ? '努力程度提升中……' : `突破 Lv${s} ${LEVELS[s].n}！`);
        }, 450 + (i-1)*per));
      });
      if (steps.length===1){ curL=L; $('#xfName').textContent=lv.n; }
      timers.push(setTimeout(finish, total));
    });
  }
  return {play};
})();

/* ---------- photo editor ---------- */
const Editor = (() => {
  let img=null, src=null, T=null, base=null, det=null;
  const cv = $('#edCanvas'), cx = cv.getContext('2d');
  function draw(){
    cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,CW,CH);
    if (img) drawPhotoCard(cx, img, T); else drawBunScene(cx);
    $('#edEmpty').hidden = !!img; $('#edGuide').style.display = img ? '' : 'none';
    $('#edTip').style.visibility = img ? 'visible' : 'hidden';
    $('#edZoom').disabled = $('#edRot').disabled = $('#edAuto').disabled = !img;
  }
  function syncSliders(){ if (!img||!base) return; $('#edZoom').value = Math.round(T.s/base.s*100); $('#edRot').value = Math.round((T.rot-base.rot)*180/Math.PI); }
  function open(){
    loadFaceApi();
    const p = store.get('photo', null);
    $('#edStrip').innerHTML='';
    if (p && p.src){
      const im=new Image(); im.onload=()=>{ img=im; src=p.src; T={...p.T}; base=p.base?{...p.base}:{...p.T}; draw(); syncSliders(); }; im.src=p.src;
    } else { img=null; src=null; T=null; draw(); }
    $('#editor').classList.add('open');
  }
  function close(){ $('#editor').classList.remove('open'); }
  function pick(){ loadFaceApi(); $('#filePhoto').click(); }
  async function load(file){
    try {
      const url = await App.shrinkFile(file, 900, .88);
      const im = new Image();
      await new Promise((r,j)=>{ im.onload=r; im.onerror=j; im.src=url; });
      img = im; src = url;
      if (!$('#editor').classList.contains('open')) { $('#edStrip').innerHTML=''; $('#editor').classList.add('open'); }
      toast('正在识别五官…（第一次会慢一点）', 4000);
      det = await findFace(im);
      T = autoT(det); base = {...T};
      draw(); syncSliders();
      toast(det.how==='center' ? '没认出脸，请手动拖到虚线框里' : det.how==='ai'||det.how==='face' ? '已找到五官并自动对齐' : '已大致对齐，可以再微调一下');
    } catch(e){ toast('这张图片打不开，换一张 JPG 或 PNG 试试'); }
  }
  $('#filePhoto').onchange = e => { const f=e.target.files[0]; e.target.value=''; if (f) load(f); };
  $('#edBack').onclick = close;
  $('#edPick').onclick = pick;
  $('#edAuto').onclick = async () => { if (!img) return; det = await findFace(img); T = autoT(det); base={...T}; draw(); syncSliders(); toast('已重新识别'); };
  $('#edReset').onclick = () => { store.del('photo'); img=null; src=null; T=null; draw(); App.setChar(buildCharacter(null)); $('#edStrip').innerHTML=''; toast('已换回默认的包子形象'); };
  $('#edZoom').oninput = e => { if (!img) return; T.s = base.s*(+e.target.value)/100; draw(); };
  $('#edRot').oninput = e => { if (!img) return; T.rot = base.rot + (+e.target.value)*Math.PI/180; draw(); };
  $('#edSave').onclick = async () => {
    if (!img){ pick(); return; }
    const ok = store.set('photo', {src, T, base});
    if (!ok) toast('手机存储空间不够，这次能用，刷新后会丢失');
    const C = buildCharacter({img, T});
    App.setChar(C);
    const strip = $('#edStrip'); strip.innerHTML = [0,2,5,7].map(L=>`<figure><img src="${levelThumb(C,L,200)}" alt="">${LEVELS[L].n}</figure>`).join('');
    toast('努力形象已生成！');
    await sleep(1100);
    close(); App.openEffort(true);
  };
  // drag + pinch on the stage
  const stage = $('#edStage'); const pts = new Map(); let lastD = 0, lastMid=null;
  stage.addEventListener('pointerdown', e => { if (!img) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if (pts.size===2){ const [a,b]=[...pts.values()]; lastD=Math.hypot(a.x-b.x,a.y-b.y); } });
  stage.addEventListener('pointermove', e => {
    if (!img || !pts.has(e.pointerId)) return;
    const k = CW / stage.clientWidth;
    const prev = pts.get(e.pointerId); const cur={x:e.clientX,y:e.clientY};
    if (pts.size===1){ T.x += (cur.x-prev.x)*k; T.y += (cur.y-prev.y)*k; }
    pts.set(e.pointerId, cur);
    if (pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if (lastD) T.s *= d/lastD; lastD=d; syncSliders(); }
    draw();
  });
  const up = e => { pts.delete(e.pointerId); lastD=0; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { if (!img) return; e.preventDefault(); T.s *= e.deltaY<0 ? 1.05 : 1/1.05; syncSliders(); draw(); }, {passive:false});
  return {open, close, pick};
})();
